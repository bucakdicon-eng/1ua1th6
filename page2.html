<!DOCTYPE html>

<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trang thứ hai</title>


<style>
    *{
        margin:0;
        padding:0;
        box-sizing:border-box;
    }

    body{
        min-height:100vh;
        background:#FCE4EC;
        display:flex;
        justify-content:center;
        align-items:center;
        font-family:"Times New Roman", Times, serif;
        overflow:hidden;
        position:relative;
    }

   .message{
    text-align:center;
    font-size:clamp(24px, 5vw, 38px);
    color:#C2185B;
    font-weight:bold;
    z-index:2;
}

 .flower{
    position:absolute;
    top:-50px;
    font-size:28px;
    opacity:0.45;
    user-select:none;

    animation:
        fall 12s linear infinite,
        sway 3s ease-in-out infinite,
        spin 6s linear infinite;
}

@keyframes fall{
    from{
        transform:translateY(-120px);
    }
    to{
        transform:translateY(110vh);
    }
}

@keyframes sway{
    0%,100%{
        margin-left:0;
    }
    50%{
        margin-left:25px;
    }
}
    .overlay{
    display:none;
    position:fixed;
    inset:0;
    background:rgba(0,0,0,0.3);
    z-index:99;
}

@keyframes spin{
    from{
        rotate:0deg;
    }
    to{
        rotate:360deg;
    }
}
   .button-back{
    position: fixed;
    top: 20px;
    left: 20px;

    padding: 8px 18px;
    font-size: 16px;

    font-family:"Times New Roman", Times, serif;
    background:#F6A5C0;
    color:white;
    border:none;
    border-radius:20px;
    cursor:pointer;
    transition:all 0.3s ease;

    z-index: 10;
}

.button-back:hover{
    transform:scale(1.05);
    background:#F48FB1;
}
.button-letter{
    margin-top:25px;
    padding:12px 32px;
    font-size:22px;
    font-family:"Times New Roman", Times, serif;

    background:#F6A5C0;
    color:white;
    border:none;
    border-radius:30px;
    cursor:pointer;

    transition:all 0.3s ease;

    animation:pulse 1.8s infinite;
}
    @keyframes pulse{
    0%{
        transform:scale(1);
        box-shadow:0 0 0 0 rgba(246,165,192,0.6);
    }

    70%{
        transform:scale(1.08);
        box-shadow:0 0 0 18px rgba(246,165,192,0);
    }

    100%{
        transform:scale(1);
        box-shadow:0 0 0 0 rgba(246,165,192,0);
    }
}

.button-letter:hover{
    transform:scale(1.12) rotate(-2deg);
    background:#F48FB1;
}
.letter{
    display:none;
    position:fixed;
    top:50%;
    left:50%;

    transform:
        translate(-50%,-50%)
        scale(0.3)
        rotate(-8deg);

    width:min(90vw, 420px);
    max-height:70vh;

    background:white;
    border-radius:12px;
    box-shadow:0 8px 25px rgba(0,0,0,0.2);

    padding:20px;
    z-index:100;

    opacity:0;
   transition:
    opacity 0.5s ease,
    transform 0.5s cubic-bezier(0.18,0.89,0.32,1.28);
    overflow-y:auto;
}

.letter.show{
    opacity:1;
    transform:
        translate(-50%,-50%)
        scale(1)
        rotate(0deg);

    animation:bounceIn 0.6s;
}
    @keyframes bounceIn{
    0%{
        transform:translate(-50%,-50%) scale(0.3);
    }

    60%{
        transform:translate(-50%,-50%) scale(1.1);
    }

    80%{
        transform:translate(-50%,-50%) scale(0.95);
    }

    100%{
        transform:translate(-50%,-50%) scale(1);
    }
}
    .letter-content{
    font-size:18px;
    line-height:1.6;
    color:#444;
    padding-top:10px;
}
    .letter-content::after{
    content:"|";
    animation:blink 0.8s infinite;
    color:#C2185B;
}
    .letter-content.finished::after{
    display:none;
}

@keyframes blink{
    50%{
        opacity:0;
    }
}
.close-btn{
    position:absolute;
    top:10px;
    right:10px;
    border:none;
    background:none;
    cursor:pointer;
    font-size:18px;
    color:#C2185B;
}

.close-btn:hover{
    transform:scale(1.1);

}

  
</style>


</head>
<body>

<div id="overlay" class="overlay" onclick="closeLetter()"></div>
<div class="flower" style="left:3%; animation-duration:20s;">🌸</div>
<div class="flower" style="left:18%; animation-duration:13s;">🌸</div>
<div class="flower" style="left:33%; animation-duration:17s;">🌸</div>
<div class="flower" style="left:45%; animation-duration:12s;">🌸</div>
<div class="flower" style="left:58%; animation-duration:19s;">🌸</div>
<div class="flower" style="left:70%; animation-duration:15s;">🌸</div>
<div class="flower" style="left:80%; animation-duration:11s;">🌸</div>
<div class="flower" style="left:95%; animation-duration:18s;">🌸</div>    

<div class="flower" style="left:8%; animation-duration:12s;">🌸</div>
<div class="flower" style="left:28%; animation-duration:15s;">🌸</div>
<div class="flower" style="left:50%; animation-duration:10s;">🌸</div>
<div class="flower" style="left:72%; animation-duration:17s;">🌸</div>
<div class="flower" style="left:90%; animation-duration:13s;">🌸</div>

<div class="flower" style="left:12%; animation-duration:18s;">🌸</div>
<div class="flower" style="left:38%; animation-duration:11s;">🌸</div>
<div class="flower" style="left:62%; animation-duration:14s;">🌸</div>
<div class="flower" style="left:85%; animation-duration:16s;">🌸</div>
    
    <div class="message">
        <div>Chúc mừng ngày Quốc tế Thiếu nhi 🌸</div>

        <button class="button-letter" onclick="openLetter()">
            Mở thư
        </button>
    </div>

    <!-- Lá thư -->
  <div id="letter" class="letter">
    <button class="close-btn" onclick="closeLetter()">✖</button>

    <div id="letter-content" class="letter-content"></div>
</div>

<button class="button-back"
        onclick="window.location.href='index.html'">
    Quay lại
</button>

  <script>
      const text = `💌

ghi ❤️`;Gửi Béo của Chỏm ❤️

Nhân ngày 1/6, Chỏm chúc Béo luôn vui vẻ, khỏe mạnh, ăn ngon ngủ ngon và lúc nào cũng giữ được nụ cười trên môi. Mong rằng mỗi ngày của Béo đều tràn ngập niềm vui, may mắn và những điều tốt đẹp.

Tuy chúng ta yêu xa, không thể ở cạnh nhau mỗi ngày, và tuy chúng ta cũng đã cãi nhau không ít lần, có những lúc giận dỗi, hiểu lầm hay làm nhau buồn, nhưng đối với Chỏm, Béo vẫn là người rất đặc biệt. Những lần cãi nhau không làm Chỏm bớt thương Béo, mà chỉ khiến Chỏm hiểu rằng để đi cùng nhau lâu dài, cả hai cần cố gắng và trân trọng nhau hơn.

Cảm ơn Béo vì đã ở bên Chỏm, cùng Chỏm trải qua những ngày vui vẻ và cả những lúc không được như ý. Chỏm mong rằng dù sau này có chuyện gì xảy ra, chúng mình vẫn sẽ luôn chọn lắng nghe, thấu hiểu và nắm tay nhau vượt qua.

Ngày 1/6 này, Chỏm chúc em bé Béo của Chỏm luôn hạnh phúc, luôn được yêu thương và sớm đạt được những điều mình mong muốn. Và điều Chỏm mong nhất là khoảng cách giữa chúng ta sẽ sớm được rút ngắn để Chỏm có thể gặp Béo thật nhiều hơn.

Chúc Béo một ngày 1/6 thật vui vẻ nhé! ❤️

Yêu Béo rất nhiều.

– Chỏm 🫶💕


let index = 0;
      
let typingTimeout;

function typeWriter() {
    const content = document.getElementById("letter-content");

    if (index < text.length) {
        content.innerHTML += text.charAt(index) === "\n"
            ? "<br>"
            : text.charAt(index);

        index++;
        typingTimeout = setTimeout(typeWriter, 25);
    } else {
        content.classList.add("finished");
    }
}
    function openLetter() {

    const music = document.getElementById("music");

music.play()
.then(() => console.log("Đã phát nhạc"))
.catch(err => console.log(err));

    clearTimeout(typingTimeout);

    const letter = document.getElementById("letter");
    const overlay = document.getElementById("overlay");
    const content = document.getElementById("letter-content");

    overlay.style.display = "block";
    letter.style.display = "block";

    content.innerHTML = "";
    content.classList.remove("finished");
    index = 0;

    setTimeout(() => {
        letter.classList.add("show");
        typeWriter();
    }, 10);
}
function closeLetter() {
    const letter = document.getElementById("letter");
    const overlay = document.getElementById("overlay");
    const content = document.getElementById("letter-content");

    clearTimeout(typingTimeout);
    content.classList.remove("finished");

    letter.classList.remove("show");

    setTimeout(() => {
        letter.style.display = "none";
        overlay.style.display = "none";
    }, 400);
}
</script>

<audio id="music" loop>
    <source src="music/Download.mp3" type="audio/mpeg">
</audio>

</body>
</html>
