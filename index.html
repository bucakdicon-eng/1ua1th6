<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pink 50 Website</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            background: #FCE4EC; /* Pink 50 */
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: "Times New Roman", Times, serif;
            overflow: hidden;
            position: relative;
        }

        .message {
            text-align: center;
            font-size: 38px;
            color: #C2185B;
            font-weight: bold;
            z-index: 2;
        }

        .credit {
            position: fixed;
            bottom: 20px;
            left: 20px;
            font-size: 20px; 
            color: #AD1457;
            z-index: 2;
        }

    .flower{
    position:absolute;
    top:-50px;
    font-size:28px;
    opacity:0.45;
    user-select:none;

    animation:
        fall 12s linear infinite,
        sway 3s ease-in-out infinite,
        spin 6s linear infinite;
}

@keyframes fall{
    from{
        transform:translateY(-120px);
    }
    to{
        transform:translateY(110vh);
    }
}

@keyframes sway{
    0%,100%{
        margin-left:0;
    }
    50%{
        margin-left:25px;
    }
}
    .overlay{
    display:none;
    position:fixed;
    inset:0;
    background:rgba(0,0,0,0.3);
    z-index:99;
}

@keyframes spin{
    from{
        transform:rotate(0deg);
    }
    to{
        transform:rotate(360deg);
    }
}


    .button-go {
        margin-top: 25px;
        padding: 12px 32px;
        font-size: 22px;
        font-family: "Times New Roman", Times, serif;
        background: #F6A5C0;
        color: white;
        border: none;
        border-radius: 30px;
        cursor: pointer;
        box-shadow: 0 4px 12px rgba(194, 24, 91, 0.2);
        transition: all 0.3s ease;
    }

    .button-go:hover {
        transform: scale(1.05);
        background: #F48FB1;
    }
</style>
</head>
<body>

    <!-- Hoa nền -->

</html>
